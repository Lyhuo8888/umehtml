<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Marquee</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">
</head>
<body>
    <marquee behavior="slide" bgcolor="red">
        Behavior slide
    </marquee>
    <marquee behavior="scroll" bgcolor="lightblue">
        Behavior scroll
    </marquee>
    <marquee behavior="alternate" bgcolor="lightgreen">
        Behavior alternate
    </marquee>
    <marquee bgcolor="lightgray">
        Welcome to Marquee
    </marquee>
    <marquee direction="right" scrollamount="10" style="background-image: url('images/road.png'); background-repeat: repeat-x; background-size: auto 100%;">
        <img src="images/car.png"  width="80"/>
    </marquee>
    <marquee direction="right" scrollamount="30" style="background-image: url('images/road.png'); background-repeat: repeat-x; background-size: auto 100%;">
        <img src="images/suv-car.png"  width="80"/>
    </marquee>
    <marquee direction="right" scrollamount="50" style="background-image: url('images/road.png'); background-repeat: repeat-x; background-size: auto 100%;">
        <img src="images/police-car.png"  width="80"/>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<img src="images/sport-car.png"  width="80"/>
    </marquee>
    <marquee direction="up" height="200px" bgcolor="yellow">
        Direction Up
    </marquee>
    <marquee direction="down" height="200px" bgcolor="green">
        Direction Down
    </marquee>
</body>
</html>
